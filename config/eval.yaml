backend: "vllm" # transformers or vllm
model: "google/gemma-4-E2B-it"
openai_model: "gpt-5.6-luna"

dataset:
  file: "data/pipeline/hf_dataset/"
  split: "test"

episodes: null # Evaluate the complete split.
seed: 1234 # Dataset selection, model generation, and vLLM server seed.
max_steps: 20
max_new_tokens: 2048
temperature: 0.0
enable_thinking: false
reasoning_effort: "none" # none, low, medium, high
concurrency: 16 # Maximum simultaneous evaluation episodes.
batch_invariant: true # Deterministic vLLM outputs across batch schedules.

# Used by the direct Transformers backend.
device: "auto"

# Used by the OpenAI-compatible vLLM server backend.
base_url: "http://localhost:8000/v1"
api_key: "local"
served_model_name: "procurement-agent"
tool_call_parser: "auto" # gemma4 for Gemma 4; hermes otherwise.
vllm_server_config: "config/vllm.yaml"
vllm_startup_timeout: 600
quantization: "none" # none or bnb_4bit; checkpoint quantization is auto-detected.

output_root: "data/evals"
