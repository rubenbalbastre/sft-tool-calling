backend: "transformers" # transformers or vllm
model: "outputs/breezy-surf-7/final_model"

episodes: 5
seed: 1234
max_steps: 10
max_new_tokens: 256
enable_thinking: false
concurrency: 8 # Maximum simultaneous vLLM inference requests.

# Used by the direct Transformers backend.
device: "auto"

# Used by the OpenAI-compatible vLLM server backend.
base_url: "http://localhost:8000/v1"
api_key: "local"
served_model_name: "supply-chain"
vllm_server_config: "config/vllm.yaml"
vllm_startup_timeout: 300
quantization: "none" # none or bnb_4bit; checkpoint quantization is auto-detected.

output_root: "data/evals"
