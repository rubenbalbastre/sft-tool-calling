seed: 42
output_dir: "data/pipeline/hf_dataset"

prompt_generation:
  languages: ["English", "Spanish", "German", "French"]
  templates:
    train: [1, 2, 3, 4, 5, 6, 7]
    validation: [8]
    test: [9, 10]

splits:
  sft_train: 400
  sft_validation: 10
  opd_train: 200
  opd_validation: 10
  test: 50

hub:
  push: false
  repo_id: rubenbalbastre/supply-chain-tool-calling
  config_name: "default"
  private: false
  token_env: "HF_TOKEN"
