defaults:
  - lora@lora
  - _self_

dataset:
  file: "data/pipeline/hf_dataset/"
  train_split: "sft_train"
  validation_split: "sft_validation"
  validation_examples: 64

train:
  style: "sft"
  run_name: null # Set this when another job needs a deterministic model path.
  seed: 42
  model_name: "HuggingFaceTB/SmolLM2-135M-Instruct" # "HuggingFaceTB/SmolLM3-3B"
  attn_implementation: "flash_attention_2"
  # Tool trajectories are several thousand tokens long. Keep the physical
  # batch small and recover the effective batch through accumulation.
  gradient_accumulation_steps: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  max_seq_length: 8192
  packing: false
  padding_free: false
  gradient_checkpointing: true
  enable_thinking: false
  reasoning_effort: "none"
  learning_rate: 2e-5
  max_steps: 48 # 1000
  use_cpu: false # false
  bf16: true # true
  fp16: false # true
  logging_steps: 1
  eval_strategy: "steps"
  eval_steps: 4
  validation_rollout_scenarios: 10
  validation_rollout_steps: 16
  early_stopping:
    enabled: true
    patience: 3 # Number of evaluations without sufficient improvement.
    threshold: 0.01
    metric: "eval_loss"
    greater_is_better: false
  checkpointing:
    save_strategy: "steps"
    save_steps: 4 # Keep aligned with eval_steps for early stopping.
    save_total_limit: 3
  final_model:
    save: true
    output_dir: "outputs"
