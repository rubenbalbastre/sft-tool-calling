defaults:
  - lora@lora
  - _self_

dataset:
  file: "data/pipeline/hf_dataset/"
  train_split: "sft_train"
  validation_split: "sft_validation"

train:
  style: "sft"
  run_name: null # Set this when another job needs a deterministic model path.
  seed: 42
  model_name: "HuggingFaceTB/SmolLM2-135M-Instruct" # "HuggingFaceTB/SmolLM3-3B"
  gradient_accumulation_steps: 2 # 4
  per_device_train_batch_size: 16 # 16
  per_device_eval_batch_size: 32 # 16
  max_seq_length: 1024
  learning_rate: 2e-5
  max_steps: 80 # 1000
  use_cpu: false # false
  bf16: true # true
  fp16: false # true
  logging_steps: 1
  eval_strategy: "steps"
  eval_steps: 2
  early_stopping:
    enabled: true
    patience: 3 # Number of evaluations without sufficient improvement.
    threshold: 0.0
    metric: "eval_loss"
    greater_is_better: false
  checkpointing:
    save_strategy: "steps"
    save_steps: 8 # Keep aligned with eval_steps for early stopping.
    save_total_limit: 3
  final_model:
    save: true
    output_dir: "outputs"
