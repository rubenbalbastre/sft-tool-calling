<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="510"
         viewBox="0 0 1320 510" role="img"
         aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Procurement tool-calling environment</title>
  <desc id="diagram-description">A model interacts with procurement tools backed by seeded SQLite data, then an executable verifier returns success and reward.</desc>
  <defs>
    <marker id="arrow-2563eb" markerWidth="8" markerHeight="8" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-0f766e" markerWidth="8" markerHeight="8" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-d97706" markerWidth="8" markerHeight="8" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: DejaVu Sans, Arial, sans-serif; }
      .heading { font-size: 25px; font-weight: 700; fill: #0f172a; }
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 400; fill: #475569; }
      .label { font-size: 13px; font-weight: 600; fill: #334155; }
      .small { font-size: 12px; font-weight: 600; fill: #475569; }
    </style>
  </defs>
  <rect width="1320" height="510" fill="#f8fafc"/>
  <text x="60" y="52" class="heading">Executable procurement environment</text>
  <text x="60" y="79" class="body">Different prompts require different tool routes; success is checked from outcomes, not an exact trace.</text>

  
    <rect x="50" y="130" width="220" height="160" rx="12"
          fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="50" y="130" width="6" height="160" rx="3" fill="#7c3aed"/>
    <text x="160.0" y="163" class="title" text-anchor="middle">User request</text>
    <text x="160.0" y="188" class="body" text-anchor="middle">Constraints</text><text x="160.0" y="206" class="body" text-anchor="middle">Preferences</text>
    
  
    <rect x="360" y="130" width="260" height="160" rx="12"
          fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="360" y="130" width="6" height="160" rx="3" fill="#2563eb"/>
    <text x="490.0" y="163" class="title" text-anchor="middle">Tool-calling model</text>
    <text x="490.0" y="188" class="body" text-anchor="middle">Chooses the next tool</text><text x="490.0" y="206" class="body" text-anchor="middle">Uses observations</text>
    
  
    <rect x="710" y="100" width="360" height="220" rx="12"
          fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="710" y="100" width="6" height="220" rx="3" fill="#0f766e"/>
    <text x="890.0" y="133" class="title" text-anchor="middle">Procurement tools</text>
    <text x="890.0" y="158" class="body" text-anchor="middle">search_suppliers</text><text x="890.0" y="176" class="body" text-anchor="middle">get_supplier_profile</text><text x="890.0" y="194" class="body" text-anchor="middle">request_quote</text><text x="890.0" y="212" class="body" text-anchor="middle">get_delivery_options</text><text x="890.0" y="230" class="body" text-anchor="middle">submit_procurement_plan</text><text x="890.0" y="248" class="body" text-anchor="middle">report_no_feasible_option</text>
    
  
    <rect x="1150" y="130" width="150" height="160" rx="12"
          fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1150" y="130" width="6" height="160" rx="3" fill="#d97706"/>
    <text x="1225.0" y="163" class="title" text-anchor="middle">Verifier</text>
    <text x="1225.0" y="188" class="body" text-anchor="middle">Evidence</text><text x="1225.0" y="206" class="body" text-anchor="middle">Feasibility</text><text x="1225.0" y="224" class="body" text-anchor="middle">Utility</text>
    

  
    <line x1="270" y1="210" x2="360" y2="210"
          stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-2563eb)"/>
    <text x="315.0" y="200" class="label" text-anchor="middle">prompt</text>
    
  
    <line x1="620" y1="180" x2="710" y2="180"
          stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-0f766e)"/>
    <text x="665.0" y="170" class="label" text-anchor="middle">tool call</text>
    
  
    <line x1="710" y1="245" x2="620" y2="245"
          stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-d97706)"/>
    <text x="665.0" y="235" class="label" text-anchor="middle">observation</text>
    
  
    <line x1="1070" y1="210" x2="1150" y2="210"
          stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-2563eb)"/>
    <text x="1110.0" y="200" class="label" text-anchor="middle">final action</text>
    

  <rect x="805" y="350" width="170" height="74" rx="12" fill="#eff6ff"
        stroke="#93c5fd" stroke-width="2"/>
  <ellipse cx="890" cy="370" rx="55" ry="12" fill="#bfdbfe" stroke="#2563eb"/>
  <path d="M835 370 v30 c0 16 110 16 110 0 v-30" fill="#dbeafe" stroke="#2563eb"/>
  <text x="890" y="398" class="title" text-anchor="middle">SQLite</text>
  <text x="890" y="444" class="small" text-anchor="middle">Fixed master data + seeded episode state</text>
  <line x1="890" y1="350" x2="890" y2="320" stroke="#2563eb" stroke-width="2.5"
        marker-end="url(#arrow-2563eb)"/>

  <path d="M1225 290 V480 H490 V290" fill="none" stroke="#d97706" stroke-width="2.5"
        marker-end="url(#arrow-d97706)"/>
  <text x="1180" y="465" class="label" text-anchor="end">success + reward</text>

</svg>
